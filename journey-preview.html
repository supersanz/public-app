<script src="scripts/travel-unlocks.js?v=seoul-diary-v74"></script><script src="scripts/reward-catalog.js?v=quest50-v47"></script><script src="scripts/journey-motion-adapter.js"></script><script>
const root='assets/backgrounds/character-style-v1/';
const places=[['황무지',1,'white-day-loop-a-v5.png','모든 여행은 작은 첫걸음에서 시작돼요.','서 있기'],['새싹 초원',5,'desert-day-loop-a-v5.png','작은 실천이 모여 초록빛 길이 되었어요.','걷기'],['푸른 숲',10,'forest-day-loop-a-v5.png','나무 사이로 스며드는 햇빛과 함께 걸어요.','걷기'],['고대 유적',20,'deepForest-day-loop-a-v5.png','오래된 돌길 너머, 새로운 이야기를 찾아요.','달리기'],['설산',30,'runFrontier-day-loop-a-v5.png','조금 더 단단해진 발걸음으로 설산을 넘어가요.','달리기 +'],['하늘 성',40,'sky-day-loop-a-v5.png','이제 땅을 벗어나 구름 위를 여행할 시간이에요.','빗자루 비행'],['한국 · 서울',50,'city-scooter-road-v1.png','서울의 풍경을 따라 스쿠터로 여행해요.','스쿠터 타기'],['일본 · 도쿄',60,'japan-travel-loop-v2.png','도쿄타워가 보이는 거리를 천천히 걸어요.','걷기']];
const $=id=>document.getElementById(id);let equipped=0,selected=0,lastFocus;
const mapIds=['white','desert','forest','deepForest','runFrontier','sky','city','japan'];
for(const [id,d] of Object.entries(TravelUnlocks.destinations)){if(!d.hidden&&!mapIds.includes(id)){mapIds.push(id);places.push([d.name,d.level,d.file,d.description,'걷기']);}}
for(let i=0;i<places.length;i++){const d=TravelUnlocks.destinations[mapIds[i]];if(d)places[i][1]=d.level;}
function mapLevelLabel(i){return TravelUnlocks.destinations[mapIds[i]]?.levelLabel||places[i][1];}
const liveMap=window.parent!==window&&typeof window.parent.getJourneyMapState==='function'?window.parent.getJourneyMapState():{level:1,background:'white'};
const mapLevel=liveMap.level;equipped=Math.max(0,mapIds.indexOf(liveMap.background));
function travelGate(i){return liveMap.unlocks?.[mapIds[i]]||TravelUnlocks.status(mapIds[i],mapLevel,[],{});}
function travelPending(i){return !!(TravelUnlocks.destinations[mapIds[i]]?.hidden||TravelUnlocks.destinations[mapIds[i]]?.pending);}
function travelLocked(i){if(travelPending(i))return true;if(liveMap.claimed?.includes(mapIds[i]))return false;const gate=travelGate(i);return gate?!gate.unlocked:places[i][1]>mapLevel;}
function renderMap(){
 const available=places.filter((p,i)=>!travelLocked(i)).length;
 document.querySelector('.intro').innerHTML='<span>발견한 장소 <b>'+available+' / '+places.length+'</b></span>';
 document.querySelector('.level').textContent='Lv. '+mapLevel;
 const current=places[equipped],nextIndex=equipped+1,next=places[nextIndex];
 const nextStop=next?'<div class="next-route" aria-hidden="true"><i></i><i></i></div><button class="next-destination" data-place="'+nextIndex+'" aria-label="다음 목적지 '+next[0]+' 상세 보기"><img src="'+root+next[2]+'" alt=""><span class="next-copy"><small>다음 목적지</small><strong>'+next[0]+'</strong><span>Lv.'+next[1]+'</span></span><span class="next-arrow" aria-hidden="true">›</span></button>':'';
 $('map').innerHTML='<button class="gallery-feature" data-place="'+equipped+'" aria-label="현재 여행지 '+current[0]+' 상세 보기"><img src="'+root+current[2]+'" alt=""><span class="gallery-current">현재 여행지</span><span class="gallery-feature-copy"><small>Lv. '+current[1]+'</small><strong>'+current[0]+'</strong></span></button>'+nextStop+'<h2 class="gallery-heading">전체 여행지</h2><div class="gallery-grid">'+places.map((p,i)=>{
 if(i===equipped)return '';
 const locked=travelLocked(i);
 return '<button class="gallery-card '+(locked?'is-locked':'')+'" data-place="'+i+'" aria-label="'+p[0]+', 레벨 '+p[1]+', '+(locked?'잠김':'해금')+'"><span class="gallery-image"><img src="'+root+p[2]+'" alt="">'+(locked?'<span class="gallery-lock" aria-hidden="true">🔒</span>':'')+'</span><span class="gallery-copy"><strong>'+p[0]+'</strong><small>Lv. '+p[1]+'</small></span></button>';
 }).join('')+'</div>';
}
function tab(which){['map','motion'].forEach(x=>{$(x+'-tab').setAttribute('aria-selected',x===which);$(x+'-panel').hidden=x!==which})}
$('map-tab').onclick=()=>tab('map');$('motion-tab').onclick=()=>tab('motion');document.querySelector('.tabs').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const next=$('map-panel').hidden?'map':'motion';tab(next);$(next+'-tab').focus()}};
function detail(i){selected=i;lastFocus=document.activeElement;const p=places[i];$('detail-img').src=root+p[2];$('detail-level').textContent=`CHAPTER ${String(i+1).padStart(2,'0')}`;$('detail-title').textContent=p[0];$('detail-copy').textContent=p[3];const gate=travelGate(i),locked=travelLocked(i);if(gate){$('detail-copy').textContent=p[3]+'\n\n'+(gate.levelMet?'✓ 레벨 달성':'Lv. '+(gate.levelLabel||gate.level)+' 필요')+' · '+gate.label+'\n'+Math.min(gate.count,gate.target)+' / '+gate.target+(gate.unit||'회');}$('detail-action').textContent=locked?'조건을 달성하면 여행할 수 있어요':i===equipped?'현재 여행 중':'이곳으로 여행하기';$('detail-action').disabled=locked||i===equipped;$('overlay').hidden=false;$('close').focus()}
function close(){$('overlay').hidden=true;lastFocus?.focus()}
$('map').onclick=e=>{const b=e.target.closest('[data-place]');if(b)detail(+b.dataset.place)};$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const bs=[...$('overlay').querySelectorAll('button:not(:disabled)')];if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===bs.at(-1)){e.preventDefault();bs[0].focus()}}});$('detail-action').onclick=()=>{if(window.parent!==window&&typeof window.parent.equipJourneyMap==='function'){const index=selected;close();window.parent.equipJourneyMap(mapIds[index]);}else{$('toast').textContent='앱의 여행·동작 탭에서 적용할 수 있어요.';close();}};
const motions=[['걷기',5,2,'한 걸음씩, 걷기'],['달리기',20,3,'조금 더 멀리, 달리기'],['빗자루 비행',40,5,'드디어, 하늘을 날다'],['스쿠터 타기',50,6,'도시를 달리는 시간']];let motion=2,exerciseTotal=0;
function syncActivityCounts(){exerciseTotal=mapLevel;renderMotion();}
function renderMotion(){const total=exerciseTotal,m=motions[motion],fly=motion===2;$('motion-title').textContent=m[0];$('motion-status').textContent=total>=m[1]?'획득 완료':'';$('motion-status').hidden=total<m[1];$('actor').hidden=fly||motion===3;$('scooter').hidden=motion!==3;$('scooter').dataset.gender=previewGender;$('actor').dataset.gender=previewGender;$('flight').dataset.female=String(previewGender==='female');$('actor').removeAttribute('data-pose');$('flight').hidden=!fly;$('progress').max=m[1]||1;$('progress').value=m[1]?Math.min(total,m[1]):1;$('progress-copy').textContent=Math.min(total,m[1])+' / Lv. '+m[1];$('choices').innerHTML=motions.map((x,i)=>'<button class="choice" data-motion="'+i+'" aria-pressed="'+(i===motion)+'"><strong>'+x[0]+'</strong><small>'+(total>=x[1]?'획득 완료':'Lv. '+x[1]+' 달성 시')+'</small></button>').join('')}
$('choices').onclick=e=>{const b=e.target.closest('[data-motion]');if(b){motion=+b.dataset.motion;renderMotion()}};window.addEventListener('focus',syncActivityCounts);renderMap();syncActivityCounts();tab(new URLSearchParams(location.search).has('embed')?'map':'motion');
</script><script src="scripts/character-eyes.js?v=female-natural-v4-20261019"></script><script src="scripts/selected-walk-arms.js?v=exact4"></script>
